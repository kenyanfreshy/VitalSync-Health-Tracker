# Sentry CLI configuration for VitalSync
# This file is read by the @sentry/react-native Xcode build phase script.
#
# IMPORTANT: Do NOT commit a real auth token here.
# Set SENTRY_AUTH_TOKEN as an EAS secret instead (see eas.json).
#
# Organization and project slugs — update these to match your sentry.io project.
defaults.org=vitalsync
defaults.project=vitalsync-clinical-hub

# Allow the build to succeed even when the auth token is missing or the upload fails.
# Remove this line (or set to false) once SENTRY_AUTH_TOKEN is configured in EAS secrets.
allow_failure=true
